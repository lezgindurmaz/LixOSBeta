# dosbox.conf  -  LixOS test konfigürasyonu
# DOSBox ile LixOS'u Ubuntu'da test etmek için

[sdl]
# Pencere boyutu (320x200 x3 = 960x600)
windowresolution=960x600
output=surface
fullscreen=false
fulldouble=false
# Mouse yakalamak için tıkla
autolock=true
sensitivity=100

[dosbox]
machine=vga
captures=capture
memsize=16

[render]
# Piksel mükemmel görünüm için
frameskip=0
aspect=true
scaler=normal3x

[cpu]
core=auto
cputype=386
# Cycle sayısı: yavaş DOS makinesi gibi
cycles=max
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=22050
blocksize=2048
prebuffer=20

[midi]
mpu401=intelligent
mididevice=default

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1

[dos]
# Uzun dosya adı desteği
xms=true
ems=true
umb=true
keyboardlayout=tr

[autoexec]
# DOSBox başlangıç komutları
# LIXOS.EXE'yi doğrudan çalıştır
# (make run tarafından -conf ve dosya adı geçilir)
